name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ABI=arm64-v8a
          TAG=${GITHUB_REF_NAME}
          OUT="ezmpv-${TAG}-${ABI}.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out "$OUT" \
            "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "$OUT"
          rm -f $RUNNER_TEMP/release.jks

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ezmpv-*.apk